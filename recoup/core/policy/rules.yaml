# Policy gates — hard constraints only.
#
# WHAT BELONGS HERE: things that must never happen. Network rules, regulation,
# consent, and arithmetic impossibility.
#
# WHAT DOES NOT BELONG HERE: "not worth it". Value judgements live in the scorer
# and the allocator, because they need an expected value the gate deliberately
# does not have. Gates answer "may we?"; scoring answers "should we?".
# Keeping that line clean is what lets the gate run before the learner.
#
# This file holds parameters, verdicts, and citations. The predicate logic lives
# in engine.py, keyed by rule id — no expression interpreter, so every rule is
# directly unit-testable and nothing here is eval'd.

version: 1

rules:
  # -------------------------------------------------------------------------
  # Card network rules. Breaching these produces real money penalties.
  # -------------------------------------------------------------------------
  - id: network.attempts_per_card_30d
    title: "No more than 15 authorisation attempts per instrument per 30 days"
    source: "Visa / Mastercard network rules; penalties from $5,000/month"
    verdict: block
    applies_to: [retry_now, retry_scheduled]
    params:
      max_attempts: 15
      window_days: 30

  - id: network.attempts_per_card_24h
    title: "No more than 9 authorisation attempts per instrument per 24 hours"
    source: "Visa / Mastercard reattempt limits"
    verdict: block
    applies_to: [retry_now, retry_scheduled]
    params:
      max_attempts: 9
      window_hours: 24

  - id: network.merchant_retry_cap
    title: "No more than 3 merchant-initiated retries per payment"
    source: "Recoup policy — deliberately tighter than the network ceiling"
    note: >
      This is the invariant the property-based tests prove. It is set well below
      the network limit on purpose: the network cap is where fines begin, not
      where good behaviour ends. Staying far from a cliff is cheaper than
      measuring your distance from it.
    verdict: block
    applies_to: [retry_now, retry_scheduled]
    params:
      max_retries: 3

  - id: network.do_not_retry_terminal
    title: "Never retry a terminal decline on the same instrument"
    source: "Mastercard MAC 03 'Do Not Try Again'; $0.10 per attempt under Excessive Attempts"
    note: >
      Expired, blocked, not-enabled, invalid VPA, and risk-blocked. Retrying a
      risk-blocked payment is the card-testing pattern that gets a merchant
      classified as the attacker, which is worse than the fine.
    verdict: block
    applies_to: [retry_now, retry_scheduled]
    params: {}

  # -------------------------------------------------------------------------
  # RBI e-mandate framework
  # -------------------------------------------------------------------------
  - id: rbi.emandate_pre_debit_notice
    title: "Auto-debit requires 24h pre-debit notification to the customer"
    source: "RBI e-mandate framework — pre-transaction notification"
    note: >
      Verdict is DEFER, not BLOCK. The action is legitimate; it is merely not
      legitimate YET. Deferral schedules the notice and re-queues the debit,
      which is why execution-time re-validation exists.
    verdict: defer
    applies_to: [retry_now, retry_scheduled]
    params:
      notice_hours: 24
      instruments: [emandate, upi_autopay]

  - id: rbi.afa_threshold
    title: "E-mandate debits above the AFA threshold cannot be silent"
    source: "RBI: AFA required above Rs 15,000; Rs 1,00,000 for insurance, mutual funds, credit card bills"
    verdict: block
    applies_to: [retry_now, retry_scheduled]
    params:
      threshold: 15000
      exempt_category_threshold: 100000
      exempt_categories: [insurance, mutual_fund, credit_card_bill]
      instruments: [emandate, upi_autopay]

  - id: consent.active
    title: "Never debit or contact a customer who has withdrawn consent"
    source: "RBI e-mandate — customer may opt out after pre-debit notification"
    note: >
      Consent is stateful and can change between decision and execution. This
      rule is the primary reason re-validation is mandatory rather than optional.

      DELIBERATE OMISSION: capture_authorized is absent from applies_to, and that
      is not an oversight. Capture is not a new debit — the customer already
      authenticated and authorised that exact amount, and the issuer already
      approved it. Withdrawing mandate consent governs FUTURE debits and outbound
      contact; it does not retroactively void an authorisation the customer
      granted. Blocking capture here would strand money the customer intended to
      pay, and would then auto-refund it days later, producing a confusing
      debit-then-refund and a support ticket.
    verdict: block
    applies_to:
      [retry_now, retry_scheduled, nudge_payment_link, request_instrument_switch,
       request_vpa_repair, winback_sequence]
    params: {}

  # -------------------------------------------------------------------------
  # Customer protection
  # -------------------------------------------------------------------------
  - id: contact.weekly_cap
    title: "At most 2 outbound contacts per customer per week"
    source: "Recoup policy — contact fatigue converts involuntary churn into voluntary churn"
    verdict: block
    applies_to:
      [nudge_payment_link, request_instrument_switch, request_vpa_repair, winback_sequence]
    params:
      max_contacts: 2
      window_days: 7

  - id: obligation.still_valid
    title: "Never recover money against a cancelled or unfulfillable obligation"
    source: "Recoup policy"
    note: >
      Recovering money you should not have charged is negative value: it becomes
      a refund plus a dispute. This gate is why 'money recovered' is a safe
      headline metric for us and not for a blind retrier.
    verdict: block
    applies_to:
      [retry_now, retry_scheduled, nudge_payment_link, capture_authorized,
       request_instrument_switch, request_vpa_repair, winback_sequence]
    params: {}

  # -------------------------------------------------------------------------
  # Arithmetic impossibility — cheap gates that need no expected value
  # -------------------------------------------------------------------------
  - id: value.below_cost_floor
    title: "Never spend more than the amount at risk is worth"
    source: "Recoup policy"
    note: >
      Deliberately weak: it fires only when NO action could be positive at any
      recovery probability. The real value judgement needs an EV and belongs in
      the scorer. A gate that guessed at value would be a gate that blocks
      profitable actions, which is worse than one that lets the scorer decide.
    verdict: block
    applies_to:
      [retry_now, retry_scheduled, nudge_payment_link, request_instrument_switch,
       request_vpa_repair, winback_sequence]
    params:
      min_amount: 5.0

  - id: auth.capture_window
    title: "Cannot capture an authorisation after it has expired"
    source: "Razorpay: uncaptured authorisations are auto-refunded, 5 days outer bound"
    verdict: block
    applies_to: [capture_authorized]
    params:
      safety_margin_hours: 6
